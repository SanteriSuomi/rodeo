name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v0.3.0
        required: true

permissions:
  contents: read

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  ZIG_VERSION: 0.15.2
  RUST_VERSION: 1.99.1

defaults:
  run:
    shell: pwsh

jobs:
  cli:
    name: cli ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # https://ziglang.org/download/index.json
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig_asset: zig-x86_64-linux-0.15.2.tar.xz
            zig_sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
            zigbuild: true
          # windows-2022, not -latest: GH's current image ships MSVC 14.52, whose
          # STL rejects zig 0.15.2's clang (<22) and breaks ghostty's C++ build.
          # Revisit when libghostty-vt-sys moves to a zig that ships clang 22+.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            zig_asset: zig-x86_64-windows-0.15.2.zip
            zig_sha256: 3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Rust
        run: |
          rustup set profile minimal
          rustup toolchain install $env:RUST_VERSION --no-self-update
          rustup default $env:RUST_VERSION
          rustup target add $env:TARGET

      - name: Zig
        run: |
          $asset = "${{ matrix.zig_asset }}"
          $file = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$asset" -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '${{ matrix.zig_sha256 }}') { throw "zig sha256 mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "zig"
          New-Item -ItemType Directory -Force $dir | Out-Null
          if ($asset.EndsWith(".zip")) {
            Expand-Archive $file $dir -Force
          } else {
            tar -xJf $file -C $dir
          }
          $inner = $asset -replace '\.(zip|tar\.(gz|xz))$', ''
          Add-Content $env:GITHUB_PATH (Join-Path $dir $inner)

      # https://github.com/rust-cross/cargo-zigbuild/releases/tag/v0.24.1
      - name: cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --locked --version 0.24.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the tag matches the version
        run: |
          $version = cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json |
            ForEach-Object { $_.packages } |
            Where-Object { $_.name -eq 'rodeo' } |
            Select-Object -First 1 -ExpandProperty version
          if ("v$version" -ne $env:TAG) {
            throw "tag $env:TAG does not match rodeo $version"
          }

      - name: Build
        run: |
          if ("${{ matrix.zigbuild }}" -eq "true") {
            cargo zigbuild --release --locked -p rodeo --target $env:TARGET
          } else {
            cargo build --release --locked -p rodeo
          }

      - name: Smoke test
        run: |
          if ("${{ matrix.zigbuild }}" -eq "true") {
            file "target/$env:TARGET/release/rodeo"
            "target/$env:TARGET/release/rodeo" --version
          } else {
            target\release\rodeo.exe --version
          }

      # The archive holds the executable alone, at its root, so a consumer
      # extracting straight to a bin dir finds it where it expects.
      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          if ("${{ matrix.zigbuild }}" -eq "true") {
            $archive = "rodeo-$env:TARGET.tar.gz"
            tar -czf "dist/$archive" -C "target/$env:TARGET/release" rodeo
          } else {
            $archive = "rodeo-$env:TARGET.zip"
            Compress-Archive target\release\rodeo.exe "dist\$archive"
          }
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "dist/$archive.sha256" -NoNewline

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
